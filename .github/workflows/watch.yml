name: Playtomic Watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub startet geplante Laeufe oft mit einigen Minuten Verspaetung
  workflow_dispatch:         # manuell starten ueber den Tab "Actions"

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Events pruefen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch.py

      - name: Zustand speichern
        run: |
          if ! git diff --quiet -- state.json || [ -n "$(git ls-files --others -- state.json)" ]; then
            git config user.name "playtomic-watcher"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Zustand aktualisiert"
            git push
          fi
